version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: blockchain
      POSTGRES_PASSWORD: blockchain
      POSTGRES_DB: blockchain_raw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.7.3
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://blockchain:blockchain@postgres/blockchain_raw
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    env_file:
      - .env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./src:/opt/airflow/src
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db init && airflow users create
        --username admin --password admin
        --firstname Admin --lastname User
        --role Admin --email admin@example.com
        && airflow webserver & airflow scheduler"

volumes:
  postgres_data:
